name: Release

# Tag a version and this builds it on each platform and publishes the installers
# to a GitHub release. electron-builder writes latest.yml and latest-mac.yml
# alongside them, which is what the updater in main/updates.ts reads.
#
#   npm version patch      # or minor / major
#   git push --follow-tags
#
# The release is created as a draft. Look at it, then publish it: publishing is
# what makes every installed copy start downloading, and that is not something
# to do by accident.
#
# version.yml calls this workflow directly rather than letting its tag push
# start it. A tag pushed with GITHUB_TOKEN does not trigger another workflow.
# That is GitHub's loop protection and no setting turns it off, so an automatic
# release that waited for the tag event would sit there doing nothing.
on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: The tag to build, when this is called rather than pushed.
        required: true
        type: string
  workflow_dispatch:

permissions:
  contents: write

# A re-run of the same tag, or a workflow_dispatch on top of a tag push,
# should not race the earlier run for the same draft release.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # electron-builder creates the GitHub release for a tag if none exists yet.
  # Two platform jobs publishing in parallel both find nothing there at the
  # same moment and each creates its own draft, so half the assets land on a
  # release nobody looks at. Creating the release once, up front, means both
  # platform jobs find it already there and upload into it instead.
  create-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "$TAG" \
            --draft \
            --notes "" \
            || echo "Release for $TAG already exists, reusing it."

  build:
    needs: create-release
    strategy:
      # One platform failing should not throw away a good build of the other.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: build:win
          - os: macos-latest
            script: build:mac

    runs-on: ${{ matrix.os }}
    timeout-minutes: 40

    steps:
      # The tag, not the branch. A called run starts from main, and building
      # main would name the installers after whatever version is on it rather
      # than the one being released.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build and publish
        run: npm run ${{ matrix.script }} -- --publish always
        env:
          # Provided by Actions. No secret needs to be created for this.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS builds are unsigned until there is a Developer ID certificate.
          # Without this, electron-builder looks for one and fails the job.
          CSC_IDENTITY_AUTO_DISCOVERY: false
