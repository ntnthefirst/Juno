name: Release

# Tag a version and this builds it on each platform and publishes the installers
# to a GitHub release. electron-builder writes latest.yml and latest-mac.yml
# alongside them, which is what the updater in main/updates.ts reads.
#
#   npm version patch      # or minor / major
#   git push --follow-tags
#
# The release is created as a draft and the installers are uploaded into it.
# The finish job then checks the draft has every file, and publishes it or
# deletes it with its tag; nothing incomplete is ever downloadable. After a
# release goes out, the prune job takes the files off releases older than the
# newest five (decision 28).
#
# version.yml calls this workflow directly rather than letting its tag push
# start it. A tag pushed with GITHUB_TOKEN does not trigger another workflow.
# That is GitHub's loop protection and no setting turns it off, so an automatic
# release that waited for the tag event would sit there doing nothing.
on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: The tag to build, when this is called rather than pushed.
        required: true
        type: string
  workflow_dispatch:

permissions:
  contents: write

# A re-run of the same tag, or a workflow_dispatch on top of a tag push,
# should not race the earlier run for the same draft release.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # electron-builder creates the GitHub release for a tag if none exists yet.
  # Two platform jobs publishing in parallel both find nothing there at the
  # same moment and each creates its own draft, so half the assets land on a
  # release nobody looks at. Creating the release once, up front, means both
  # platform jobs find it already there and upload into it instead.
  #
  # The release page gets the version's entry from build/release-notes.md, the
  # same text the update feed carries, so the page and the app never disagree.
  # The heading is left off because the release title already names the version.
  # The script fails when the version has no entry, which stops the release here.
  create-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Write the notes for this version
        run: |
          node scripts/release-notes.mjs
          tail -n +2 build/release-notes-latest.md | sed '1{/^$/d}' > release-body.md

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "Release for $TAG already exists, reusing it and updating its notes."
            gh release edit "$TAG" --repo "${{ github.repository }}" --notes-file release-body.md
          else
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --title "$TAG" \
              --draft \
              --notes-file release-body.md
          fi

  build:
    needs: create-release
    strategy:
      # One platform failing should not throw away a good build of the other.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: build:win
            cache: |
              ~\AppData\Local\electron\Cache
              ~\AppData\Local\electron-builder\Cache
          - os: macos-latest
            script: build:mac
            cache: |
              ~/Library/Caches/electron
              ~/Library/Caches/electron-builder

    runs-on: ${{ matrix.os }}
    timeout-minutes: 40

    steps:
      # The tag, not the branch. A called run starts from main, and building
      # main would name the installers after whatever version is on it rather
      # than the one being released.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The Electron zip and the signing and installer tools electron-builder
      # downloads, keyed on the lockfile so they are fetched once per Electron
      # version instead of once per release.
      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: ${{ matrix.cache }}
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-

      - name: Install
        run: npm ci

      - name: Build and publish
        run: npm run ${{ matrix.script }} -- --publish always
        env:
          # Provided by Actions. No secret needs to be created for this.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS builds are unsigned until there is a Developer ID certificate.
          # Without this, electron-builder looks for one and fails the job.
          CSC_IDENTITY_AUTO_DISCOVERY: false

  # The draft is checked before anybody can download it. A release missing an
  # installer, a blockmap or an update feed is worse than no release: the
  # updater finds it and fails on every machine. So an incomplete draft is
  # deleted together with its tag, and the next merge cuts the same version
  # again. A complete one is published, as the latest release, or as a
  # pre-release when the tag carries a suffix such as v1.4.0-beta.1. The updater
  # skips pre-releases unless the running copy is one itself.
  #
  # It runs when a build failed too, because that is the incomplete draft it
  # exists to remove.
  finish:
    needs: [create-release, build]
    if: ${{ always() && needs.create-release.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Check, then publish or delete
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
          BUILD: ${{ needs.build.result }}
        run: node scripts/release-finish.mjs

  # Only after a release went out. Every release keeps its page, its notes and
  # its tag; the five newest also keep their files, and the older ones lose
  # them, because nobody installs a version that old and each one is half a
  # gigabyte of storage.
  prune:
    needs: finish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Remove the files of releases older than the newest five
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-prune.mjs
